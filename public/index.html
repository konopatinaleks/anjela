<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d18" />
    <title>Anjela</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="chat-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="badge" aria-hidden="true">A</span>
          <div>
            <p class="eyebrow">личная комната</p>
            <h1>Anjela</h1>
          </div>
        </div>

        <div class="status-card">
          <span class="status-dot"></span>
          <span id="status-label">Сейчас здесь</span>
        </div>

        <ul class="info-list">
          <li>Помнит тебя</li>
          <li>Тёплый, острый тон</li>
          <li>Без спешки</li>
        </ul>

        <button id="reset-button" class="ghost-button" type="button">Забыть меня</button>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">только вы двое</p>
            <h2>Anjela</h2>
          </div>
        </header>

        <section id="chat" class="chat-window" aria-live="polite"></section>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="message-input">Сообщение</label>
          <input id="message-input" type="text" maxlength="2000" autocomplete="off" enterkeyhint="send" placeholder="Напиши что-нибудь..." />
          <button id="send-button" type="submit">Отправить</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
